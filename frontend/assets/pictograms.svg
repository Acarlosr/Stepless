<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stepless — Pictogramas de acessibilidade
  Estilo ADA / ISO 7001: traço grosso, formas simplificadas, legíveis a 24px.
  Uso: <svg class="picto" viewBox="0 0 32 32"><use href="assets/pictograms.svg#picto-ramp"/></svg>
  Cor herdada via currentColor — nunca hardcode.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Rampa / entrada sem degrau: plano inclinado + usuário de cadeira -->
  <symbol id="picto-ramp" viewBox="0 0 32 32">
    <path d="M2 26h28" />
    <path d="M4 26 24 9" />
    <circle cx="12" cy="20.5" r="3.4" />
    <path d="M12 17.1V13m0 0h4.2" />
    <circle cx="12" cy="10.2" r="1.7" fill="currentColor" stroke="none" />
  </symbol>

  <!-- Elevador: cabine + setas de subida e descida -->
  <symbol id="picto-elevator" viewBox="0 0 32 32">
    <rect x="5" y="4" width="14" height="24" rx="2.5" />
    <path d="M12 4v24" />
    <path d="M25 12V6m0 0-2.6 2.6M25 6l2.6 2.6" />
    <path d="M25 20v6m0 0 2.6-2.6M25 26l-2.6-2.6" />
  </symbol>

  <!-- Banheiro acessível: cadeira de rodas dentro de um recinto -->
  <symbol id="picto-restroom" viewBox="0 0 32 32">
    <rect x="3.5" y="4.5" width="25" height="23" rx="3" />
    <circle cx="14.6" cy="11.2" r="1.9" fill="currentColor" stroke="none" />
    <path d="M14.6 14.4v5.1h4.6" />
    <circle cx="14.2" cy="21.4" r="3.6" />
    <path d="M21.6 19.4l1.8 4.4" />
  </symbol>

  <!-- Vaga PCD: letra P sobre marcação de vaga -->
  <symbol id="picto-parking" viewBox="0 0 32 32">
    <rect x="3.5" y="3.5" width="25" height="25" rx="4" />
    <path d="M12.4 23V9.6h4.1a3.9 3.9 0 0 1 0 7.8h-4.1" />
  </symbol>

  <!-- Piso tátil: relevo direcional em linhas paralelas + alerta em pontos -->
  <symbol id="picto-tactile" viewBox="0 0 32 32">
    <path d="M4 7.5h24M4 13h24M4 18.5h24" />
    <circle cx="7.5" cy="25" r="1.6" fill="currentColor" stroke="none" />
    <circle cx="14" cy="25" r="1.6" fill="currentColor" stroke="none" />
    <circle cx="20.5" cy="25" r="1.6" fill="currentColor" stroke="none" />
    <circle cx="27" cy="25" r="1.6" fill="currentColor" stroke="none" />
  </symbol>

  <!-- Selo de verificação: check dentro de anel com relevo de piso tátil -->
  <symbol id="picto-seal" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="12.5" />
    <path d="M10.4 16.6l3.8 3.8 7.4-8" stroke-width="2.6" />
    <circle cx="16" cy="3.5" r="1.15" fill="currentColor" stroke="none" />
    <circle cx="28.5" cy="16" r="1.15" fill="currentColor" stroke="none" />
    <circle cx="16" cy="28.5" r="1.15" fill="currentColor" stroke="none" />
    <circle cx="3.5" cy="16" r="1.15" fill="currentColor" stroke="none" />
  </symbol>

  <!-- Aguardando verificação: relógio -->
  <symbol id="picto-pending" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="12.5" />
    <path d="M16 8.5V16l5.4 3.4" />
  </symbol>

  <!-- Problema reportado: alerta triangular -->
  <symbol id="picto-issue" viewBox="0 0 32 32">
    <path d="M16 4.6 29 27H3z" />
    <path d="M16 12.4v6.4" />
    <circle cx="16" cy="22.6" r="1.35" fill="currentColor" stroke="none" />
  </symbol>

  <!-- Busca / você está aqui -->
  <symbol id="picto-locate" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="6.4" />
    <path d="M16 2.5v4.2M16 25.3v4.2M2.5 16h4.2M25.3 16h4.2" />
  </symbol>

</svg>
