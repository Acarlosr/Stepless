name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Solidity — compila e testa
  # ─────────────────────────────────────────────
  solidity:
    name: Solidity Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # forge-std está versionado em contracts/lib/forge-std. Rodar `forge install`
      # com a pasta já presente falha ("already exists") e derrubava o job antes
      # de compilar — por isso os testes Foundry não rodavam no CI. Só instala
      # se a pasta não estiver no checkout.
      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          if [ -f lib/forge-std/src/Test.sol ]; then
            echo "forge-std já versionado em contracts/lib/forge-std"
          else
            forge install foundry-rs/forge-std --no-git
          fi

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            contracts/out
            contracts/cache
          key: foundry-${{ runner.os }}-${{ hashFiles('**/*.sol', 'contracts/foundry.toml') }}
          restore-keys: foundry-${{ runner.os }}-

      - name: Compile
        working-directory: contracts
        run: forge build

      # -W: warnings viram erro. Um `unused variable` num contrato que guarda
      # dinheiro costuma indicar que alguém esqueceu de usar o valor.
      # A opção mudou de nome entre versões do Foundry: `-W`/`--deny-warnings`
      # (antigas) → `--deny warnings` (atuais). Com a nightly, `-W` passou a ser
      # recusado como argumento desconhecido (exit 2) — o job falhava aqui sem
      # nunca ter olhado um aviso de verdade.
      - name: Lint (warnings as errors)
        working-directory: contracts
        run: |
          if forge build --help | grep -q -- '--deny <'; then
            forge build --force --deny warnings
          else
            forge build --force --deny-warnings
          fi

      # Análise estática do forge-lint: só informa, não bloqueia. Revisar os
      # avisos novos a cada mudança em contrato que guarda dinheiro.
      - name: Lint estático (informativo)
        working-directory: contracts
        continue-on-error: true
        run: forge lint || true

      - name: Test
        working-directory: contracts
        run: forge test -vvv

      # Cobertura mínima nas funções que movem dinheiro. Antes da v5 não havia
      # NENHUM teste para saque, retry ou fundeio da tesouraria.
      #
      # `forge coverage` desliga o otimizador para mapear linhas, e o
      # RewardDistributor estoura "stack too deep" sem ele. `--ir-minimum`
      # é a saída recomendada pelo Foundry. É métrica, não teste: quem bloqueia
      # o merge é o passo "Test" acima.
      - name: Coverage
        working-directory: contracts
        continue-on-error: true
        run: forge coverage --ir-minimum --report lcov --report summary

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: contracts/lcov.info
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Job 2: JS — sintaxe, testes e config de rede
  # ─────────────────────────────────────────────
  javascript:
    name: JS Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Falha se frontend/network.js ou mobile/src/config/network.generated.ts
      # estiverem fora de sincronia com config/networks.json. É o que impede a
      # divergência de 31/07–05/08/2026 (web no v3, mobile no v4) de se repetir.
      - name: Sintaxe e config de rede
        run: npm run check

      # Inclui test/mainnet-hardening.test.js, que trava cada correção da
      # auditoria de mainnet — uma regressão quebra aqui, não em produção.
      - name: Testes
        run: npm test

  # ─────────────────────────────────────────────
  # Job 3: Segredos no histórico
  # ─────────────────────────────────────────────
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: uma chave vazada continua vazada

      # O cabeçalho do antigo api/rotate-admin.js registrava que a chave do
      # relayer "vazou no histórico do git". Sem varredura automática, a
      # próxima vez também só se descobre depois.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 4: Frontend
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Arquivos obrigatórios
        run: |
          for f in frontend/index.html frontend/dashboard.html frontend/dashboard.js \
                   frontend/arc-config.js frontend/network.js \
                   api/relay.js api/upload.js config/networks.json; do
            test -f "$f" && echo "✅ $f" || { echo "❌ falta $f"; exit 1; }
          done

      # network.js precisa ser carregado antes de qualquer script que use
      # window.STEPLESS_NETWORK — senão a página quebra em runtime, não no CI.
      - name: network.js carregado nas páginas
        run: |
          for f in frontend/index.html frontend/dashboard.html frontend/buscar.html; do
            grep -q 'src="network.js"' "$f" || { echo "❌ $f não carrega network.js"; exit 1; }
            echo "✅ $f"
          done

  # ─────────────────────────────────────────────
  # Job 5: Subgraph
  # ─────────────────────────────────────────────
  subgraph:
    name: Subgraph Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f subgraph/subgraph.yaml && echo "✅ subgraph.yaml" || { echo "❌ falta"; exit 1; }
          test -f subgraph/schema.graphql && echo "✅ schema.graphql" || { echo "❌ falta"; exit 1; }
