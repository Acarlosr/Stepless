[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

# Arc Testnet configuration
# Chain ID: 5042002
# RPC: https://rpc.testnet.arc.network
# Gas token: USDC (native, 18 decimals; ERC-20 at 0x3600... uses 6 decimals)
# Block time: ~0.48s
# Finality: deterministic, sub-second
# EVM baseline: Osaka

# O forge-lint (análise estática nova do Foundry) rodava junto com o build e,
# com `--deny warnings` no CI, cada aviso dele derrubava o job. Os 77 avisos
# revisados em 2026-11-08 são falsos positivos para estes contratos:
#   - block-timestamp: prazos em horas/dias (timelock, campanhas, teto diário);
#   - reentrancy-*: chamadas ao USDC já protegidas por nonReentrant + CEI;
#   - arbitrary-send-erc20 (X402API._chargeFee): sempre chamado com msg.sender;
#   - missing-zero-check (transferAdmin): address(0) cancela, de propósito.
# O lint continua rodando no CI como passo informativo (não bloqueia);
# avisos do COMPILADOR continuam bloqueando.
[lint]
lint_on_build = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 128

# Fork Arc Testnet for integration tests:
# ARC_RPC_URL=https://... forge test --fork-url arc-testnet
[rpc_endpoints]
arc-testnet = "${ARC_RPC_URL}"
